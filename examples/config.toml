# Playback defaults to native Rust; downloads use native Rust with yt-dlp fallback.
# Empty output directories use ~/Videos/ytui and ~/Music/ytui.
# Installed Node.js 22+ or Deno 2.9.7 is detected for native challenge solving.
# Set native_js_runtime = "/path/to/supported/runtime" at the top level to override.

version = 1
theme = "system"
language = "en" # en, de, system (LC_ALL / LC_MESSAGES / LANG)
theme_provider = "auto"
image_protocol = "auto"
thumbnails = true
music_player_style = "classic" # classic, vinyl, vu, orbit; append -fullscreen for expanded views (Music / Radio only)
reduced_motion = false
playback_history = true
resume_on_play = true # continue partly watched videos where you left off (needs playback_history)
seek_seconds = 5 # seek-forward/back step (1-600)
prefer_offline = true # play a completed download instead of streaming the same item
preload_next = true # resolve the next queued item shortly before the current one ends
autoplay_related = true # when the queue ends, continue with related videos (Android: Related media autoplay)
show_hints = true
playback_sponsorblock = "skip"
playback_sponsor_categories = ["sponsor"]
concurrency = 3
max_retries = 3
retry_delay_seconds = 5
download_backend = "auto"
playback_backend = "native"
yt_dlp = "yt-dlp"
ffmpeg = "ffmpeg"
ffprobe = "ffprobe"
mpv = "mpv"
cliamp = "cliamp"
nmcli = "nmcli"
auth_store = "keyring"
account_index = 0
radio_servers = []
radio_pinned_countries = []
custom_stations = []
clipboard_watcher = false
notifications = true
notification_sound = false

[download]
audio = false
quality = "1080"
container = "mp4"
audio_container = "mp3"
audio_quality = "0"
directory = ""
audio_directory = ""
filename_template = "%(title).180s [%(id)s].%(ext)s"
subtitles = []
auto_subtitles = false
embed_subtitles = true
metadata = true
thumbnail = false
playlist = false
bandwidth_kib = 0
global_bandwidth_kib = 0
sponsorblock = []
sponsorblock_api = "https://sponsor.ajay.app"
sponsorblock_remove = false
split_chapters = false
skip_duplicates = true

# Daily windows use local system time. Omit to disable; midnight spans work.
[schedule]
# download_window = "22:30-06:00"
# bandwidth_window = "09:00-18:00"
window_bandwidth_kib = 0

[keybindings]

# Details on catalog rows (Android: Settings → Video information).
[card_info]
channel = true
views = false
upload_date = false
duration = true
section = true
likes = false
description = true # in the selected item's details panel
