[workspace]
members = ["crates/ytui-core", "crates/ytui-services", "crates/ytui"]
resolver = "2"

[workspace.package]
version = "0.2.0-alpha.10"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/Vanir20342222/ytui"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
reqwest = { version = "0.12", features = ["json", "native-tls", "stream", "socks"] }
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"
tempfile = "3"
