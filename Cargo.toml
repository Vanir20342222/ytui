[workspace]
members = ["crates/ytui-core", "crates/ytui-services", "crates/ytui-providers", "crates/ytui-mobile", "apps/desktop"]
resolver = "2"
exclude = ["vendor/yt-dlp-rs"]

[workspace.package]
version = "0.2.0-alpha.12"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/Vanir20342222/ytui"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "socks"] }
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"
tempfile = "3"

[patch."https://github.com/aagedal/yt-dlp-rs"]
yt-dlp-rs = { path = "vendor/yt-dlp-rs" }
