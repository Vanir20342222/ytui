plugins { id 'com.android.application' }
android {
    namespace 'dev.ytui.android'
    compileSdk 35
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'dev.ytui.android'
        minSdk 26
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        targetSdk 35
        versionCode 1
        versionName '0.2.0-alpha.12-mobile.1'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildFeatures { buildConfig true }
    sourceSets { main { jniLibs.srcDirs = [rootProject.file('../../target/android-jni')]; assets.srcDirs = [rootProject.file('../../target/android-assets')] }; androidTest { assets.srcDirs = [rootProject.file('../../target/android-test-assets'),rootProject.file('../../vendor/yt-dlp-rs/vendor/ejs'),rootProject.file('../../vendor/yt-dlp-rs/tests/fixtures/youtube/challenges')] } }
    packaging { jniLibs { useLegacyPackaging false } }
    buildTypes { debug { debuggable true }; release { minifyEnabled false } }
    lint { abortOnError true; checkReleaseBuilds true }
}
dependencies {
    implementation 'androidx.annotation:annotation-experimental:1.4.1'
    implementation 'androidx.games:games-activity:4.4.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.media3:media3-exoplayer:1.8.0'
    implementation 'androidx.media3:media3-exoplayer-dash:1.8.0'
    implementation 'androidx.media3:media3-exoplayer-hls:1.8.0'
    implementation 'androidx.media3:media3-session:1.8.0'
    implementation 'androidx.media3:media3-database:1.8.0'
    implementation 'androidx.javascriptengine:javascriptengine:1.1.1'
    implementation 'androidx.work:work-runtime:2.10.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
