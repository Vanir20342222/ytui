"Changes stay in this window until saved. Esc discards edits." = "Änderungen werden erst beim Speichern übernommen. Esc verwirft sie."
"System follows your desktop palette. Left/Right cycles choices." = "System folgt der Desktop-Palette. Links/Rechts ändert die Auswahl."
"Defaults apply to new jobs. Rates are KiB/s; 0 disables a cap." = "Standards gelten für neue Aufträge. Raten in KiB/s; 0 hebt das Limit auf."
"Languages and SponsorBlock categories are comma-separated." = "Sprachen und SponsorBlock-Kategorien durch Kommas trennen."
"F2 → Account connects your browser. Credentials stay out of settings." = "F2 → Konto verbindet den Browser. Sitzungsdaten sind keine Einstellungen."
"Local time HH:MM-HH:MM; blank disables a window." = "Ortszeit HH:MM-HH:MM; leer deaktiviert das Zeitfenster."
"External tools are launched only by their corresponding actions." = "Externe Programme starten nur durch die zugehörigen Aktionen."
"Skip marks sponsors and skips them. B toggles; U replays a skipped part." = "Skip markiert und überspringt Werbung. B schaltet um; U spielt ein Segment erneut."
"Countries: DE,US. Servers: comma-separated HTTP(S) origins; blank discovers." = "Länder: DE,US. Server: HTTP(S)-Adressen mit Kommas; leer sucht automatisch."
"Choose audio/video quality and format. Enter starts the download." = "Audio-/Videoqualität und Format wählen. Enter startet den Download."
"Choose a destination; playlist indices use ranges such as 1,3:7." = "Ziel wählen; Playlist-Einträge als Bereiche wie 1,3:7 angeben."
"Subtitle languages are comma-separated; captions depend on the source." = "Untertitelsprachen mit Kommas trennen; Verfügbarkeit hängt von der Quelle ab."
"en = English; de = Deutsch; system follows LC_ALL, LC_MESSAGES or LANG. Saved changes apply immediately. Tool/provider errors keep their original text." = "en = Englisch; de = Deutsch; system folgt LC_ALL, LC_MESSAGES oder LANG. Nach dem Speichern sofort aktiv. Programm-/Anbieterfehler bleiben im Original."
"Maximum height in pixels, not a guarantee the source offers it. Actual formats are in Actions → Available formats." = "Maximale Höhe in Pixeln, abhängig von der Quelle. Tatsächliche Formate: Aktionen → Verfügbare Formate."
"Use 128K/320K for a target bitrate, or 0–10 VBR quality (0 is best). Lossless formats ignore bitrate. Applies to this/new jobs." = "128K/320K für Zielbitrate oder 0–10 für VBR (0 ist beste Qualität). Verlustfreie Formate ignorieren die Bitrate. Gilt für diesen/neue Aufträge."
"Directory for this/new jobs. Existing files and queued job destinations are never moved by changing a default." = "Ordner für diesen/neue Aufträge. Bestehende Dateien und vorgemerkte Ziele werden beim Ändern eines Standards nicht verschoben."
"One-based available entries, e.g. 1,3:7. Use whole-collection individual jobs for persistent entry status/retry." = "Verfügbare Einträge ab 1, z. B. 1,3:7. Einzelaufträge einer Sammlung ermöglichen gespeicherten Status und gezieltes Wiederholen."
"Comma-separated language codes (de,en). Available captions depend on the extractor; automatic captions require the separate toggle." = "Sprachcodes mit Kommas (de,en). Verfügbarkeit hängt vom Extractor ab; automatische Untertitel separat aktivieren."
"Native stays in Rust; Auto can invoke installed external yt-dlp for supported limitations. Playback has its own backend setting." = "Native bleibt in Rust; Auto kann installiertes yt-dlp bei unterstützten Grenzen nutzen. Wiedergabe hat ein eigenes Backend."
"Native never starts Python yt-dlp. Auto permits fallback. Changes apply to the next playback; tools are never installed automatically." = "Native startet kein Python-yt-dlp. Auto erlaubt Fallback. Änderungen gelten ab der nächsten Wiedergabe; keine automatische Programminstallation."
"Auto uses detected terminal capability. Saved changes rebuild visible cards immediately; Ghostty supports Kitty graphics." = "Auto nutzt erkannte Terminalfähigkeiten. Gespeicherte Änderungen bauen sichtbare Karten neu auf; Ghostty unterstützt Kitty-Grafiken."
"Keyring needs an unlocked desktop keyring. File is explicit private local storage. Browser cookies are imported only after confirmation." = "Keyring braucht einen entsperrten Schlüsselbund. File speichert ausdrücklich lokal und privat. Browser-Cookies werden erst nach Bestätigung importiert."
"0 selects the primary YouTube account; other indices select available brand channels. Changing a connected account requires validation." = "0 wählt das primäre YouTube-Konto; andere Indizes verfügbare Markenkanäle. Kontoänderungen werden geprüft."
"HTTP(S) or SOCKS5 URL. Browsing/downloads support remote SOCKS DNS; mpv requires HTTP(S) or OS VPN routing. Credentials stay out of support exports." = "HTTP(S)- oder SOCKS5-URL. Browsing/Downloads unterstützen entferntes SOCKS-DNS; mpv braucht HTTP(S) oder System-VPN. Keine Zugangsdaten im Supportexport."
"Per-job transfer cap in KiB/s; 0 disables this cap. Global/schedule caps may also apply." = "Transferlimit pro Auftrag in KiB/s; 0 deaktiviert es. Globale/Zeitplan-Limits können zusätzlich gelten."
