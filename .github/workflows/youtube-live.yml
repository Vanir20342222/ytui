name: YouTube live
on:
  workflow_dispatch:
  push:
    branches: ['fix/playback-fallback']
    paths:
      - '.github/workflows/youtube-live.yml'
      - 'apps/desktop/tests/live_youtube.rs'
      - 'tools/test-youtube.sh'
permissions:
  contents: read
concurrency:
  group: youtube-live-${{ github.ref }}
  cancel-in-progress: true
jobs:
  public-network:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Probe public YouTube from the GitHub runner
        shell: bash
        run: |
          failures=0
          for origin in https://www.youtube.com https://music.youtube.com; do
            if status=$(curl --silent --show-error --location --max-time 25 --output /dev/null --write-out '%{http_code}' "$origin"); then
              echo "$origin HTTP $status"
              [[ "$status" =~ ^[23] ]] || failures=$((failures + 1))
            else
              echo "$origin transport failed"
              failures=$((failures + 1))
            fi
          done
          exit "$failures"
  public-media:
    needs: public-network
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        backend: [auto, yt-dlp]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install media test tools
        timeout-minutes: 10
        run: bash tools/ci-install-media.sh mpv ffmpeg
      - name: Install external extractor for the explicit live backend matrix
        timeout-minutes: 4
        shell: bash
        run: |
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 60 https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux --output "$RUNNER_TEMP/yt-dlp"
          chmod +x "$RUNNER_TEMP/yt-dlp"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Test public browsing, playback and downloads through ytui
        env:
          YTUI_LIVE_TEST_BACKEND: ${{ matrix.backend }}
        run: tools/test-youtube.sh "$YTUI_LIVE_TEST_BACKEND"
