name: Publish locally signed Android APK
on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'Temporary HTTPS file-service URL of the already signed APK (never a key/archive)'
        required: true
        type: string
      sha256:
        description: 'SHA256 of that APK'
        required: true
        type: string
      version_code:
        description: 'Expected Android version code'
        required: true
        type: string
      version_name:
        description: 'Expected version name'
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: android-local-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'Vanir20342222/ytui' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      YTUI_APK_URL: ${{ inputs.apk_url }}
      YTUI_APK_SHA256: ${{ inputs.sha256 }}
      YTUI_VERSION_CODE: ${{ inputs.version_code }}
      YTUI_VERSION_NAME: ${{ inputs.version_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Require successful exact-source main checks
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=100" > "$RUNNER_TEMP/checks.json"
          python3 - <<'PY'
          import json, os, pathlib
          runs = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'checks.json').read_text())['workflow_runs']
          passed = {r['name'] for r in runs if r['head_sha'] == os.environ['GITHUB_SHA'] and r['head_branch'] == 'main' and r['status'] == 'completed' and r['conclusion'] == 'success'}
          missing = {'Android', 'Rust', 'Secret scan'} - passed
          if missing:
              raise SystemExit('Wait for successful main checks: ' + ', '.join(sorted(missing)))
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install pinned inspection tools
        run: sdkmanager 'build-tools;35.0.0' 'ndk;27.2.12479018'
      - name: Download, verify and inspect the signed APK
        run: |
          printf '::add-mask::%s\n' "$YTUI_APK_URL"
          python3 tools/android/verify-local-release.py
          apk="publish/ytui-$YTUI_VERSION_NAME.apk"
          tools/android/inspect-apk.sh "$apk" >> publish/APK-inspection.txt
      - name: Publish the verified APK without rebuilding or signing
        run: |
          tag="android-$YTUI_VERSION_NAME"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo 'A release already exists for this version; use an increasing version.' >&2
            exit 1
          fi
          gh release create "$tag" publish/*.apk publish/SHA256SUMS.txt publish/APK-inspection.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "ytui Android $YTUI_VERSION_NAME" --notes-file publish/notes.md --draft --prerelease --latest=false
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
