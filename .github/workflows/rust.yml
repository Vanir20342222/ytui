name: Rust
on:
  push:
    branches: [main, 'rewrite/**', 'improve/**', 'fix/**']
  pull_request:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Verify native YouTube JavaScript solver with saved player vectors
        run: tools/test-native-solver.sh
      - name: Install real-media fixture tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg lua5.4 mpv
      - name: Install pinned yt-dlp for local-media integration checks
        run: |
          curl --fail --location --retry 2 https://github.com/yt-dlp/yt-dlp/releases/download/2026.10.21/yt-dlp_linux --output "$RUNNER_TEMP/yt-dlp"
          chmod +x "$RUNNER_TEMP/yt-dlp"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Check mpv window menu with a synthetic API
        run: lua5.4 crates/ytui-services/tests/player_menu.lua
      - name: Verify native cuts, chapters and splitting with FFmpeg
        env:
          NO_PROXY: 127.0.0.1,localhost
        run: cargo test -p ytui-services --locked real_ffmpeg_ -- --ignored
      - name: Verify actual audio downloads in MP3, M4A, Opus and FLAC
        env:
          NO_PROXY: 127.0.0.1,localhost
        run: cargo test -p ytui --test downloads --locked real_ffmpeg_native_audio_ -- --ignored
      - name: Verify actual mpv external-extraction handoff
        env:
          NO_PROXY: 127.0.0.1,localhost
        run: cargo test -p ytui-services --locked real_mpv_external_playback_ -- --ignored
      - name: Verify native HLS manifest and request identity in mpv
        run: cargo test -p ytui-services --locked real_mpv_native_hls_ -- --ignored
      - name: Verify headless playback diagnostic with real mpv
        run: cargo test -p ytui --test downloads --locked real_mpv_playback_check_ -- --ignored
      - name: Verify two real yt-dlp playlist entries with FFmpeg and ffprobe
        run: cargo test -p ytui --test downloads --locked real_ytdlp_playlist_ -- --ignored
      - run: cargo build --release --locked
