name: Secret scan
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install checksum-pinned Gitleaks
        shell: bash
        run: |
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 60 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan all fetched history without logging secret values
        run: '"$RUNNER_TEMP/gitleaks" git --redact=100 --log-opts="--all" --ignore-gitleaks-allow --gitleaks-ignore-path .gitleaksignore .'
