name: Publish tested Android preview
on:
  push:
    branches: [feat/android-monorepo]
    paths: [.github/workflows/android-preview.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: android-native-preview-2026-10-28
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'Vanir20342222/ytui' && (github.ref == 'refs/heads/feat/android-monorepo' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      # Publish only this reviewed checkpoint, never an arbitrary untested build.
      YTUI_SOURCE: 4b2e988247124e2afa17ae3b75d22077d95e7115
      YTUI_TAG: android-native-preview-2026-10-28
      YTUI_APK: ytui-android-0.2.0-alpha.12-mobile.2.apk
      YTUI_SHA256: 2587c533994e69a340730fbe7ba6400cbf80f6216844dfa46ad3bd711fd84791
    steps:
      - name: Require successful checks for the tested source
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$YTUI_SOURCE&per_page=100" > "$RUNNER_TEMP/checks.json"
          python3 - <<'PY'
          import json, os, pathlib
          runs = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'checks.json').read_text())['workflow_runs']
          passed = {r['name'] for r in runs if r['head_sha'] == os.environ['YTUI_SOURCE'] and r['status'] == 'completed' and r['conclusion'] == 'success'}
          missing = {'Android', 'Rust', 'Secret scan'} - passed
          if missing:
              raise SystemExit('Missing successful checkpoint checks: ' + ', '.join(sorted(missing)))
          PY
      - name: Download the exact tested artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 40668747753
          artifact-ids: 12807657622
          path: tested
          merge-multiple: true
      - name: Verify and prepare public assets
        run: |
          python3 - <<'PY'
          import hashlib, os, pathlib, shutil
          apk = pathlib.Path('tested/outputs/apk/debug/app-debug.apk')
          digest = hashlib.file_digest(apk.open('rb'), 'sha256').hexdigest()
          if digest != os.environ['YTUI_SHA256']:
              raise SystemExit('Tested APK checksum mismatch; refusing publication')
          output = pathlib.Path('preview')
          output.mkdir()
          shutil.copyfile(apk, output / os.environ['YTUI_APK'])
          shutil.copyfile(apk.with_name('SHA256-and-checks.txt'), output / 'APK-inspection.txt')
          (output / 'SHA256SUMS.txt').write_text(digest + '  ' + os.environ['YTUI_APK'] + '\n')
          PY
          cat > notes.md <<'NOTES'
          Android native UI **development preview**: shared Rust engine and native Jetpack Compose controls.

          Download the `.apk` below on Android and open it from Files. No GitHub sign-in or ZIP extraction is needed. Android 8+, ARM64 and x86-64; version `0.2.0-alpha.12-mobile.2`, code `2`.

          This is the exact APK from [Android run 40668747753](https://github.com/Vanir20342222/ytui/actions/runs/40668747753), source `4b2e988`, PR merge revision `494627636f39e34b4be5fbb18ee2fa8bd012a616`. It is not rebuilt or re-signed. Check its checksum with `SHA256SUMS.txt`.

          **Passed:** 317 offline Rust tests, 12 Android unit tests and 17 emulator checks, including real text input, all 13 themes, account navigation and visible generated-video playback. The separate public YouTube check was skipped.

          **Still pending:** Galaxy Tab S9 / Nothing Phone (3a) acceptance, real YouTube/account playback, audible output and OEM background behavior. [Validation and limitations](https://github.com/Vanir20342222/ytui/blob/feat/android-monorepo/docs/android/VALIDATION.md). This does not mark M9 complete or replace the stable signing process.

          Development signing can differ from earlier APKs. If Android reports an incompatible signature, preserve/export wanted app data before replacing an installation. A stable owner signing identity is still pending.
          NOTES
      - name: Publish a prerelease with direct APK downloads
        run: |
          if gh release view "$YTUI_TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease > existing.txt; then
            test "$(cat existing.txt)" = true
          else
            gh release create "$YTUI_TAG" --repo "$GITHUB_REPOSITORY" --target "$YTUI_SOURCE" --title 'Android native UI — development preview (2026-10-28)' --notes-file notes.md --draft --prerelease --latest=false
          fi
          gh release upload "$YTUI_TAG" preview/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$YTUI_TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md --draft=false --prerelease --latest=false
